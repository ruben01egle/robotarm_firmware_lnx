# Servo gains of the sim's position and velocity command interfaces, read by robotarm_mujoco_hardware
# (hardware parameter pids_config_file in urdf/robotarm_sim.ros2_control.xacro). Per joint, on the measured
# joint velocity, computed by its ServoPlugin before every physics step (1 kHz), with the controller's target
# moved to the physics time:
#
#   tau = kp·(p* − p) + kd·(v* − v) + ki·∫(p* − p) dt + tau_ff
#
# clamped to the URDF effort limit, the integral too, and the integral pauses while the output saturates.
# tau_ff is the torque_ff command (ff_controller), like the moteus feedforward torque.
#
# A generic servo that makes the sim follow position/velocity commands, NOT a model of the moteus position
# loop: the gains are tuned for stable, stiff tracking in the sim only and say nothing about the real arm.
#
# ω = 80 rad/s, ζ = 1 at a reference inertia per joint (kp = M·ω², kd = 2·ω·M, ki = kp·ω/10), M the median M_ii
# over random poses without armature, axis6 at 2e-4 kg·m². Checked offline with the URDF armature at 500 Hz,
# also with cycle times jittering between 2 and 3 ms: stable, tracking a 2 rad/s sine within 0.05 rad, no
# torque chatter. On the physics thread (1 kHz, no timing mismatch) the margin is larger. The damping on the
# measured velocity needs a realistic armature on the light wrist joints: with armature 0 it chatters on axis6.
# Retune if the URDF armature changes a joint's inertia a lot.

axis1: {kp: 2200.0, ki: 18000.0, kd: 56.0}
axis2: {kp: 4100.0, ki: 33000.0, kd: 100.0}
axis3: {kp: 770.0, ki: 6000.0, kd: 19.0}
axis4: {kp: 54.0, ki: 430.0, kd: 1.4}
axis5: {kp: 36.0, ki: 290.0, kd: 0.9}
axis6: {kp: 1.3, ki: 10.0, kd: 0.032}
