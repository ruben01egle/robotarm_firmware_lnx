controller_manager:
  ros__parameters:
    defaults:
      allow_controller_activation_with_inactive_hardware: false
      deactivate_controllers_on_hardware_self_deactivate: true
      switch_controller:
        strictness: strict

    diagnostics:
      threshold:
        controller_manager:
          periodicity:
            mean_error:
              error: 10.0
              warn: 5.0
            standard_deviation:
              error: 10.0
              warn: 5.0
        controllers:
          execution_time:
            mean_error:
              error: 200.0
              warn: 100.0
            standard_deviation:
              error: 20.0
              warn: 10.0
          periodicity:
            mean_error:
              error: 10.0
              warn: 5.0
            standard_deviation:
              error: 10.0
              warn: 5.0
        hardware_components:
          execution_time:
            mean_error:
              error: 200.0
              warn: 100.0
            standard_deviation:
              error: 20.0
              warn: 10.0
          periodicity:
            mean_error:
              error: 10.0
              warn: 5.0
            standard_deviation:
              error: 10.0
              warn: 5.0

    enforce_command_limits: true
    handle_exceptions: true
    hardware_components_initial_state:
      inactive:
        - moteus_hardware_system
      shutdown_on_initial_state_failure: false
    overruns:
      print_warnings: true
    update_rate: 500

    lock_memory: true
    thread_priority: 99

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    teleop_controller:
      type: robotarm_controllers/TeleopController

    # Executes trajectories planned by MoveIt on the high-level PC (FollowJointTrajectory action
    # ~/follow_joint_trajectory). Spawned inactive; activated by control_center for a mission.
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

moteus_hardware_system:
  ros__parameters:
    execution_mode: "pipelined"  # pipelined or strict_sequential
    timeout_transport_us: 1000
    time_transport: false
    
    transport:
      usb_device: "/dev/fdcanusb"

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50

teleop_controller:
  ros__parameters:
    joints:
      - axis1
      - axis2
      - axis3
      - axis4
      - axis5
      - axis6
    command_interfaces:
      - position
      - velocity
    max_velocity: 3.0
    max_acceleration: 4.0
    max_jerk: 10.0
    sync_joints: false

# Joint names, controller name and action namespace must match moveit_controllers.yaml in
# robotarm_core/src/robotarm_moveit_config.
joint_trajectory_controller:
  ros__parameters:
    joints:
      - axis1
      - axis2
      - axis3
      - axis4
      - axis5
      - axis6
    # position + velocity: interpolated position plus velocity feedforward, selects the PVC mode
    # of moteus_interface (same as teleop_controller, so both cannot be active at the same time)
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    interpolation_method: splines
    # Safety net against a robot that does not follow the trajectory (blocked joint, collision,
    # too aggressive limits): the goal is aborted and the controller holds the current position
    # if the tracking error of any joint exceeds "trajectory" [rad] while moving, or "goal" [rad]
    # after goal_time [s] at the end. PRELIMINARY values, tune on hardware.
    constraints:
      stopped_velocity_tolerance: 0.05  # [rad/s] robot counts as stopped below this
      goal_time: 0.5
      axis1: {trajectory: 0.1, goal: 0.01}
      axis2: {trajectory: 0.1, goal: 0.01}
      axis3: {trajectory: 0.1, goal: 0.01}
      axis4: {trajectory: 0.1, goal: 0.01}
      axis5: {trajectory: 0.1, goal: 0.01}
      axis6: {trajectory: 0.1, goal: 0.01}