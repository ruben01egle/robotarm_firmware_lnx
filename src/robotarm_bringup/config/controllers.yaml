controller_manager:
  ros__parameters:
    defaults:
      allow_controller_activation_with_inactive_hardware: false
      deactivate_controllers_on_hardware_self_deactivate: true
      switch_controller:
        strictness: strict

    diagnostics:
      threshold:
        controller_manager:
          periodicity:
            mean_error:
              error: 10.0
              warn: 5.0
            standard_deviation:
              error: 10.0
              warn: 5.0
        controllers:
          execution_time:
            mean_error:
              error: 200.0
              warn: 100.0
            standard_deviation:
              error: 20.0
              warn: 10.0
          periodicity:
            mean_error:
              error: 10.0
              warn: 5.0
            standard_deviation:
              error: 10.0
              warn: 5.0
        hardware_components:
          execution_time:
            mean_error:
              error: 200.0
              warn: 100.0
            standard_deviation:
              error: 20.0
              warn: 10.0
          periodicity:
            mean_error:
              error: 10.0
              warn: 5.0
            standard_deviation:
              error: 10.0
              warn: 5.0

    enforce_command_limits: true
    handle_exceptions: true
    hardware_components_initial_state:
      inactive:
        - moteus_hardware_system
      shutdown_on_initial_state_failure: false
    overruns:
      print_warnings: true
    update_rate: 500

    lock_memory: true
    thread_priority: 99

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    teleop_controller:
      type: robotarm_controllers/TeleopController

    cartesian_jog_controller:
      type: robotarm_controllers/CartesianJogController

moteus_hardware_system:
  ros__parameters:
    execution_mode: "pipelined"  # pipelined or strict_sequential
    timeout_transport_us: 1000
    time_transport: false
    
    transport:
      usb_device: "/dev/fdcanusb"

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50

teleop_controller:
  ros__parameters:
    joints:
      - axis1
      - axis2
      - axis3
      - axis4
      - axis5
      - axis6
    command_interfaces:
      - position
      - velocity
    max_velocity: 3.0
    max_acceleration: 4.0
    max_jerk: 10.0
    sync_joints: false

cartesian_jog_controller:
  ros__parameters:
    lambda: 0.01                    # damping of the damped least squares jacobian inverse

    max_linear_velocity: 0.1        # m/s
    max_linear_acceleration: 0.5    # m/s²
    max_linear_jerk: 5.0            # m/s³

    max_angular_velocity: 0.5       # rad/s
    max_angular_acceleration: 2.0   # rad/s²
    max_angular_jerk: 20.0          # rad/s³

    kp_linear: 10.0                 # 1/s, ik drift correction, kp / update_rate must be < 1
    kp_angular: 10.0                # 1/s
    max_correction_linear: 0.01     # m/s
    max_correction_angular: 0.05    # rad/s

    max_tracking_error: 0.1         # rad, |q_cmd - q_meas| per joint before stopping

    joint_limit_zone: 0.2           # rad, slow down zone in front of a position limit
    joint_limit_margin: 0.02        # rad, stop this far before a position limit
